<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование профиля — SubBonch</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/icon_light.svg}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/layout :: header}"></header>
  <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>
  <main class="content-area">
    <div class="profile-card" th:if="${currentUser != null}">
      <div class="profile-cover"></div>
      <div class="profile-body">
        <div class="profile-avatar-edit">
          <div class="profile-avatar-placeholder"
               id="avatarPreviewFallback"
               th:text="${#strings.toUpperCase(#strings.substring(currentUser.firstName, 0, 1))}">И</div>
          <img src="" alt="Аватар" class="profile-avatar-img" id="avatarPreviewImg" style="display: none;">
        </div>
        <div class="profile-edit-header">
          <h1 class="profile-edit-title">Редактирование профиля</h1>
          <p class="profile-edit-subtitle">Измените личную информацию, которую видят другие студенты</p>
        </div>
        <div class="alert-banner error" th:if="${errorMessage != null}" th:text="${errorMessage}">
          Проверьте правильность заполнения полей.
        </div>
        <form th:action="@{/profile/edit}" method="POST" class="edit-form">
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label-custom" for="firstName">Имя</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                class="form-input"
                th:value="${currentUser.firstName}"
                placeholder="Введите имя"
                oninput="previewAvatarLetter(this.value)"
                required
              >
            </div>
            <div class="form-group">
              <label class="form-label-custom" for="lastName">Фамилия</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                class="form-input"
                th:value="${currentUser.lastName}"
                placeholder="Введите фамилию"
                required
              >
            </div>
          </div>
          <div class="form-group">
            <label class="form-label-custom" for="profilePictureUrl">Ссылка на фото профиля</label>
            <input
              type="url"
              id="profilePictureUrl"
              name="profilePictureUrl"
              class="form-input"
              th:value="${currentUser.profilePictureUrl}"
              placeholder="https://example.com"
              oninput="previewAvatarUrl(this.value)"
            >
          </div>
          <div class="form-group">
            <label class="form-label-custom" for="about">О себе</label>
            <textarea
              id="about"
              name="about"
              class="form-textarea"
              rows="4"
              placeholder="Расскажите о себе, курсе, направлении или увлечениях..."
              th:text="${currentUser.about}"
            ></textarea>
          </div>
          <div class="edit-form-footer">
            <a th:href="@{/profile}" class="btn-secondary btn-link-reset">Отмена</a>
            <button type="submit" class="btn-submit-modal">Сохранить изменения</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: createClubModal}"></div>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
